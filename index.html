<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <title>Eric Zurn</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="content">
        <div class="spot"></div>
        <p>Eric Zurn</p>
        <span class="subtitle">Portfolio launching soon</span>
    </div>

    <!-- experience section -->
    <section class="section">
        <h2 class="section-title">Experience</h2>

        <div class="card">
            <div class="spot"></div>
            <div class="card-img">
                <div class="card-frame">
                    <span class="frame-label">Company Name</span>
                </div>
            </div>
            <div class="card-body">
                <h3 class="card-title">Job Title</h3>
                <span class="card-meta">2022 — Present</span>
                <p class="card-desc">Brief description of what you did and built here.</p>
            </div>
        </div>

    </section>

    <!-- education section -->
    <section class="section">
        <h2 class="section-title">Education</h2>

        <div class="card">
            <div class="spot"></div>
            <div class="card-img">
                <div class="card-frame">
                    <span class="frame-label">School Name</span>
                </div>
            </div>
            <div class="card-body">
                <h3 class="card-title">Degree / Course</h3>
                <span class="card-meta">2020 — 2024</span>
                <p class="card-desc">Brief description of what you studied.</p>
            </div>
        </div>

    </section>
    <script src="js/index.js"></script>
</body>
</html>
